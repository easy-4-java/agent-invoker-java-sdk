name: Build

on:
  push:
    branches: [2.7.x]
  pull_request:
    branches: [2.7.x]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '8'
          cache: maven
      - name: Build and test
        run: mvn -B --no-transfer-progress verify
